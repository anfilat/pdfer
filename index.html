<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PDFer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #222;
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
      touch-action: none;
    }

    /* ===== Welcome screen ===== */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      gap: 24px;
    }
    #welcome h1 {
      font-size: 2rem;
      color: #222;
    }
    #welcome .subtitle {
      color: #888;
      font-size: 0.95rem;
    }
    .btn-open-welcome {
      background: #fff;
      color: #333;
      border: 2px solid #ccc;
      border-radius: 12px;
      padding: 14px 36px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-open-welcome:active { background: #d0d0d0; }

    /* ===== Toolbar ===== */
    #toolbar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 48px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
    }
    #toolbar .filename {
      flex: 1;
      font-size: 0.85rem;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 6px;
    }
    .tbtn {
      background: none;
      border: none;
      color: #333;
      font-size: 1.3rem;
      padding: 8px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tbtn:active { background: #e0e0e0; }
    .tbtn.active {
      background: #d0d0d0;
    }

    /* Rotation icon */
    .rotate-icon { width: 26px; height: 26px; }
    .rotate-icon.ccw .cw-group { display: none; }
    .rotate-icon.cw .ccw-group { display: none; }

    /* ===== PDF viewport ===== */
    #viewport {
      display: none;
      position: fixed;
      top: 48px; left: 0; right: 0; bottom: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: #e0e0e0;
      touch-action: pan-x pan-y; /* allow scroll but prevent browser zoom */
    }
    #pdf-container {
    }
    .page-wrapper {
      margin: 4px auto;
      position: relative;
      width: calc(var(--base-w, 0) * var(--effective-scale, 1) * 1px);
      height: calc(var(--base-h, 0) * var(--effective-scale, 1) * 1px);
    }
    .page-wrapper canvas {
      display: block;
      width: 100%;
      height: 100%;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
    }

    /* Horizontal layout when rotated 90° */
    #pdf-container.horizontal {
      white-space: nowrap;
    }
    #pdf-container.horizontal .page-wrapper {
      display: inline-block;
      vertical-align: top;
      margin: 4px;
    }

    /* hide scrollbar */
    #viewport::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>

  <!-- Welcome screen -->
  <div id="welcome">
    <h1>📄 PDFer</h1>
    <button class="btn-open-welcome" id="btn-open-welcome">Open PDF</button>
    <input type="file" id="file-input" accept="application/pdf" hidden />
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tbtn" id="btn-rotate" title="Rotate 90°">
      <svg class="rotate-icon ccw" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <!-- CCW: left vertical + top horizontal with arrow → (top-left corner) -->
        <g class="ccw-group">
          <line x1="6" y1="5" x2="6" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="6" y1="5" x2="18" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="14,2 18,5 14,8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <!-- CW: same L-shape but arrow points down at bottom of vertical -->
        <g class="cw-group">
          <line x1="6" y1="5" x2="6" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="6" y1="5" x2="18" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polyline points="3,15 6,19 9,15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    </button>
    <button class="tbtn" id="btn-lock" title="Lock horizontal scroll">🔒</button>
    <span class="filename" id="filename"></span>
    <button class="tbtn" id="btn-open-toolbar" title="Open another file">📂</button>
  </div>

  <!-- PDF viewport -->
  <div id="viewport">
    <div id="pdf-container"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
